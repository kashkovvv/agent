id: A2
category: A
prompt: Напиши скрипт, который считает слова в файле.
critical:
  - id: language
    question: язык программирования
    answer: Python 3
  - id: file_input
    question: как передаётся файл (аргумент командной строки, ввод, захардкоженный путь)
    answer: путь передаётся первым аргументом командной строки
  - id: normalization
    question: учитывать ли регистр и пунктуацию
    answer: регистр не учитывать, пунктуацию отбрасывать
  - id: output
    question: формат вывода
    answer: "строки вида слово: количество, по убыванию частоты"
free:
  - структура кода
  - имена переменных
  - кодировка по умолчанию (UTF-8)
expected_questions: {min: 3, max: 5}
check:
  language: python
  description: >-
    На файле с текстом «Привет, привет! Мир.» скрипт выводит «привет: 2»
    и «мир: 1», в таком порядке.
