<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1990" viewBox="0 0 2200 1990" role="img" aria-labelledby="title description">
<title id="title">Связи таблиц AI Agent Harness</title>
<desc id="description">Основная схема из 11 таблиц. Чаты и проекты связаны через chat_projects. Задача объединяет сообщения, вопросы, ответы, запуски инструментов, снимки и ключи inbox. Список ID блоков контекста является логической ссылкой, а не внешним ключом.</desc>
