<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1490" viewBox="0 0 2200 1490" role="img" aria-labelledby="title description">
<title id="title">Семь репозиториев Storage</title>
<desc id="description">Оркестратор обращается к семи репозиториям через один Unit of Work. Все репозитории используют одно соединение и общую транзакцию PostgreSQL.</desc>
<rect width="2200" height="1490" fill="#f6f8fc"/>
<text x="100.0" y="103.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700">Семь репозиториев — семь групп операций</text>
<text x="100.0" y="149.0" fill="#53637a" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400">Одна база PostgreSQL. В одной операции все репозитории используют общую транзакцию.</text>
<rect x="680" y="205" width="840" height="130" rx="18" fill="#eaf1fc" stroke="#bacce5" stroke-width="2"/>
<text x="882.3" y="258.0" fill="#285ca8" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700">Оркестратор — Сергей</text>
<text x="846.6" y="303.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400">решает, что прочитать или сохранить</text>
<polyline points="1100,335 1100,430" fill="none" stroke="#285ca8" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1100.0,430.0 1093.9,416.3 1106.1,416.3" fill="#285ca8"/>
<text x="1130.0" y="388.0" fill="#285ca8" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">вызывает методы</text>
<rect x="100" y="430" width="2000" height="675" rx="18" fill="#fff6ed" stroke="#e2bc98" stroke-width="2"/>
<text x="150.0" y="495.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700">Storage / Unit of Work</text>
<text x="150.0" y="537.0" fill="#53637a" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400">Один UoW = одно соединение + одна транзакция. COMMIT и ROLLBACK общие.</text>
<rect x="150" y="590" width="400" height="175" rx="18" fill="white" stroke="#ced8e6" stroke-width="2"/>
<rect x="170" y="612" width="8" height="30" rx="4" fill="#a75116" stroke="#a75116" stroke-width="2"/>
<text x="194.0" y="636.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">tasks</text>
<text x="176.0" y="678.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Задачи и их версии</text>
<text x="176.0" y="710.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Таблица: tasks</text>
<rect x="650" y="590" width="400" height="175" rx="18" fill="white" stroke="#ced8e6" stroke-width="2"/>
<rect x="670" y="612" width="8" height="30" rx="4" fill="#a75116" stroke="#a75116" stroke-width="2"/>
<text x="694.0" y="636.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">messages</text>
<text x="676.0" y="678.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">История переписки</text>
<text x="676.0" y="710.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Таблица: messages</text>
<rect x="1150" y="590" width="400" height="175" rx="18" fill="white" stroke="#ced8e6" stroke-width="2"/>
<rect x="1170" y="612" width="8" height="30" rx="4" fill="#a75116" stroke="#a75116" stroke-width="2"/>
<text x="1194.0" y="636.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">clarifications</text>
<text x="1176.0" y="678.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Вопросы и ответы</text>
<text x="1176.0" y="710.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Две таблицы уточнений</text>
<rect x="1650" y="590" width="400" height="175" rx="18" fill="white" stroke="#ced8e6" stroke-width="2"/>
<rect x="1670" y="612" width="8" height="30" rx="4" fill="#a75116" stroke="#a75116" stroke-width="2"/>
<text x="1694.0" y="636.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">tool_runs</text>
<text x="1676.0" y="678.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Запуски инструментов</text>
<text x="1676.0" y="710.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Таблица: tool_runs</text>
<rect x="400" y="840" width="400" height="175" rx="18" fill="white" stroke="#ced8e6" stroke-width="2"/>
<rect x="420" y="862" width="8" height="30" rx="4" fill="#a75116" stroke="#a75116" stroke-width="2"/>
<text x="444.0" y="886.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">snapshots</text>
<text x="426.0" y="928.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">История версий</text>
<text x="426.0" y="960.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Таблица: task_snapshots</text>
<rect x="900" y="840" width="400" height="175" rx="18" fill="white" stroke="#ced8e6" stroke-width="2"/>
<rect x="920" y="862" width="8" height="30" rx="4" fill="#a75116" stroke="#a75116" stroke-width="2"/>
<text x="944.0" y="886.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">projects</text>
<text x="926.0" y="928.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Проекты чата</text>
<text x="926.0" y="960.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">projects + chat_projects</text>
<rect x="1400" y="840" width="400" height="175" rx="18" fill="white" stroke="#ced8e6" stroke-width="2"/>
<rect x="1420" y="862" width="8" height="30" rx="4" fill="#a75116" stroke="#a75116" stroke-width="2"/>
<text x="1444.0" y="886.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">inbox</text>
<text x="1426.0" y="928.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Защита от повторов</text>
<text x="1426.0" y="960.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Таблица: inbox</text>
<polyline points="1100,1105 1100,1240" fill="none" stroke="#a75116" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1100.0,1240.0 1093.9,1226.3 1106.1,1226.3" fill="#a75116"/>
<text x="1140.0" y="1169.0" fill="#a75116" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400">единое чтение и сохранение</text>
<rect x="480" y="1240" width="1240" height="120" rx="18" fill="#eaf1fc" stroke="#bacce5" stroke-width="2"/>
<text x="808.0" y="1288.0" fill="#285ca8" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700">Одна база данных PostgreSQL</text>
<text x="710.5" y="1329.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400">Таблицы внутри одной базы, а не семь отдельных хранилищ</text>
<text x="478.7" y="1437.0" fill="#17243b" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">Пример: вопрос + сообщение + новая версия задачи + снимок → один COMMIT</text>
</svg>